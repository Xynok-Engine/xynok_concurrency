[package]
name = "xynok_concurrency"
version = "0.1.88"
edition = "2024"


[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
redundant_field_names = "allow"
# I follow the "one struct per file" convention by placing `Foo` in `foo/foo.rs`, so the duplicate module name is intentional
module_inception = "allow"
missing_safety_doc = "allow"
too_many_arguments = "allow"

[lints.rust]
# `loom` is not a feature: it has to replace `std`'s atomics at compile time, so it is switched
# on with `RUSTFLAGS="--cfg loom"` instead. Declaring it here keeps rustc from warning about an
# unknown cfg on every normal build.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dependencies]
paste = "1.0.15"
xynok_std = { git = "https://github.com/Xynok-Engine/xynok_std.git" }


[target.'cfg(loom)'.dependencies]
loom = "0.7"
